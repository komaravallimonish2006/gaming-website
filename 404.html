<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Grid Sector Not Found | Nexus Gaming</title>
    <meta name="description" content="The requested sector does not exist in the Nexus Grid. Return to the gaming arena.">
    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-red-500/10 rounded-full blur-[160px]"></div>
    </div>

    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-36">
        <div class="max-w-lg w-full bg-[#0c1128]/90 backdrop-blur-2xl border border-red-500/30 rounded-3xl p-8 md:p-12 shadow-[0_0_80px_rgba(239,68,68,0.2)] text-center">
            
            <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 text-3xl">
                <i class="fa-solid fa-triangle-exclamation animate-bounce"></i>
            </div>

            <span class="text-xs font-mono text-red-400 uppercase tracking-widest block mb-2">ERROR 404 • SIGNAL LOST</span>
            <h1 class="text-4xl md:text-5xl font-black text-white mb-4">SECTOR DISCONNECTED</h1>
            
            <p class="text-sm text-gray-300 leading-relaxed mb-8 font-light">
                The coordinates you are navigating to have disintegrated or never existed in the Nexus memory bank.
            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a 
                    href="/dashboard.html" 
                    class="w-full sm:w-auto px-6 py-3.5 bg-gradient-to-r from-accent-blue to-cyan-300 text-black font-extrabold text-sm rounded-full hover:scale-105 active:scale-95 transition-all shadow-[0_0_25px_rgba(0,240,255,0.4)] flex items-center justify-center gap-2"
                >
                    <i class="fa-solid fa-gamepad"></i> Launch Games Arena
                </a>
                <a 
                    href="/" 
                    class="w-full sm:w-auto px-6 py-3.5 bg-white/10 hover:bg-white/20 text-white font-medium text-sm rounded-full border border-white/10 transition-all flex items-center justify-center gap-2"
                >
                    <i class="fa-solid fa-house"></i> Nexus Central
                </a>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. All systems operational.
    </footer>
