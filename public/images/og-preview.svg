<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#070b19" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="cyanOrb" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="300" fill="url(#cyanOrb)" />
  <circle cx="950" cy="450" r="350" fill="url(#purpleOrb)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" />
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630" />
  </g>

  <!-- Brand Badge -->
  <g transform="translate(100, 120)">
    <rect width="220" height="40" rx="20" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" />
    <text x="25" y="25" fill="#00f0ff" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="2">ZERO-LATENCY ARENA</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="-2">
    NEXUS <tspan fill="url(#neonGrad)">GAMING</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">
    The high-performance retro web arcade. 10+ games, 60 FPS, and Auth0 security.
  </text>

  <!-- Tech tags -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="160" height="50" rx="14" fill="#0f172a" stroke="#334155" />
    <text x="30" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Auth0 Shield</text>

    <rect x="180" y="0" width="160" height="50" rx="14" fill="#0f172a" stroke="#334155" />
    <text x="210" y="32" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold">Vercel Edge</text>

    <rect x="360" y="0" width="160" height="50" rx="14" fill="#0f172a" stroke="#334155" />
    <text x="390" y="32" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">60 FPS Canvas</text>

    <rect x="540" y="0" width="160" height="50" rx="14" fill="#0f172a" stroke="#334155" />
    <text x="570" y="32" fill="#f43f5e" font-family="sans-serif" font-size="16" font-weight="bold">Rate Limited</text>
  </g>
</svg>
