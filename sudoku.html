<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Master Grid | Nexus Gaming</title>
    <meta name="description" content="Play Sudoku Master Grid online. Test mathematical logic and deduction with varying puzzle seeds and real-time answer checking.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Sudoku Master Grid | Nexus Gaming">
    <meta property="og:description" content="Classic 9x9 Japanese logic puzzle in modern cyber aesthetics.">
    <meta property="og:image" content="/images/sudoku.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
    <style>
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            background: rgba(12, 17, 40, 0.9);
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(129, 140, 248, 0.2);
            gap: 1px;
            border: 2px solid rgba(0, 240, 255, 0.4);
            max-width: 100%;
            overflow-x: auto;
        }
        .sudoku-cell {
            width: 40px;
            height: 40px;
            background: rgba(10, 15, 30, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-family: 'Orbitron', sans-serif;
            color: white;
            cursor: pointer;
        }
        .sudoku-cell:nth-child(3n) { border-right: 2px solid #00f0ff; }
        .sudoku-cell:nth-child(9n) { border-right: none; }
        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #00f0ff; }
        
        .sudoku-cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 1.25rem;
            font-family: 'Orbitron', sans-serif;
            color: #a855f7;
            outline: none;
        }
        .sudoku-cell.prefilled {
            color: white;
            background: rgba(255, 255, 255, 0.08);
            font-weight: 800;
        }
    </style>
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/3 left-1/3 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[140px]"></div>
    </div>

    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 pt-32 pb-20">
        <div class="game-wrapper fade-in-up flex flex-col items-center">
            <div class="game-header text-center mb-6">
                <span class="text-xs font-mono text-indigo-400 uppercase tracking-widest block mb-1">Grid Deduction</span>
                <h1 class="text-3xl md:text-4xl font-black text-white">Sudoku Master</h1>
                <div id="status" class="status-display mt-2 font-mono text-sm px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-indigo-300 inline-block">
                    Fill the grid!
                </div>
            </div>
            
            <div class="sudoku-grid" id="grid">
                <!-- Grid injected via JS -->
            </div>

            <div class="game-controls flex items-center justify-center gap-4 text-center mt-6">
                <button id="restart-btn" class="px-6 py-3 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-extrabold text-sm tracking-wide hover:shadow-[0_0_25px_rgba(129,140,248,0.4)] hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    New Puzzle
                </button>
                <button id="check-btn" class="px-6 py-3 rounded-full bg-white/10 hover:bg-white/20 text-white font-medium text-sm border border-white/10 hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Check Answers
                </button>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. All rights reserved.
    </footer>

    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/sudoku.js"></script>
</body>
</html>
