<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Nexus Gaming - Register Operative</title>
    <meta name="description" content="Register your free Nexus Gaming account. Instant access to browser arcade retro games, global leaderboards, and zero-latency play.">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Register | Nexus Gaming">
    <meta property="og:description" content="Join the Nexus Gaming arena. Free access to hand-crafted retro games with Auth0 enterprise security.">
    <meta property="og:image" content="/images/og-preview.svg">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <!-- Futuristic Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- Navigation Root -->
    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <!-- Main Register Container -->
    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-24">
        <div id="auth-card" class="max-w-md w-full bg-[#0c1128]/85 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 shadow-[0_0_80px_rgba(0,0,0,0.8)]">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-accent-blue/10 border border-accent-blue/20 text-accent-blue text-xs font-mono uppercase tracking-wider mb-4">
                    <i class="fa-solid fa-gamepad"></i> Join the Nexus Network
                </div>
                <h1 class="text-3xl font-black tracking-tight text-white mb-2">Create Operative ID</h1>
                <p class="text-sm text-gray-400">Claim your handle and synchronize high scores</p>
            </div>

            <form id="register-form" class="space-y-4">
                <!-- Bot Honeypot -->
                <input type="text" name="nexus_security_trap" style="display:none;" tabindex="-1" autocomplete="off">

                <div>
                    <label for="username" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        <i class="fa-solid fa-user text-accent-blue mr-1.5"></i> Operative Handle
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Choose a handle (e.g. NeoPixel)" 
                        required 
                        autocomplete="username"
                        minlength="3"
                        maxlength="20"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                </div>

                <div>
                    <label for="email" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        <i class="fa-solid fa-envelope text-accent-blue mr-1.5"></i> Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="operative@domain.com" 
                        required 
                        autocomplete="email"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                </div>

                <div>
                    <label for="password" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        <i class="fa-solid fa-lock text-accent-blue mr-1.5"></i> Access Key / Password
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Minimum 8 characters" 
                        required 
                        autocomplete="new-password"
                        minlength="8"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                </div>

                <div class="text-[11px] text-gray-400 pt-1">
                    By registering, you acknowledge our 
                    <a href="/privacy.html" class="text-accent-blue hover:underline">Privacy Policy</a> and 
                    <a href="/terms.html" class="text-accent-blue hover:underline">Terms of Service</a>.
                </div>

                <button 
                    type="submit" 
                    class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-400 to-accent-blue text-black font-extrabold text-sm tracking-wide hover:shadow-[0_0_30px_rgba(0,240,255,0.4)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer mt-3"
                >
                    Initialize Account <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>

            <p class="text-center text-xs text-gray-400 mt-6">
                Already registered? <a href="/login.html" class="text-accent-blue hover:underline font-bold">Log in here</a>
            </p>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. Secured by Auth0 & Vercel Edge.
    </footer>

    <script type="module" src="/js/auth.js"></script>
</body>
</html>
