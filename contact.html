<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support & Bug Bounty | Nexus Gaming</title>
    <meta name="description" content="Get in touch with the Nexus Gaming development team. Report gameplay bugs, request new retro arcade games, or inquire about developer partnerships.">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Contact Us | Nexus Gaming">
    <meta property="og:description" content="Reach out to Nexus Gaming engineers and community coordinators.">
    <meta property="og:image" content="/images/og-preview.png">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/images/og-preview.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/3 left-1/3 w-[450px] h-[450px] bg-accent-blue/5 rounded-full blur-[140px]"></div>
    </div>

    <!-- Navigation Root -->
    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-32">
        <div class="max-w-xl w-full bg-[#0c1128]/85 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 md:p-10 shadow-[0_0_80px_rgba(0,0,0,0.8)]">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent-blue/10 border border-accent-blue/20 text-accent-blue text-xs font-mono uppercase tracking-widest mb-3">
                    <i class="fa-solid fa-headset"></i> Operative Uplink
                </div>
                <h1 class="text-3xl md:text-4xl font-black text-white mb-2">Transmission Center</h1>
                <p class="text-sm text-gray-400">Encountered an issue or want to suggest a retro arcade title? Transmit your log below.</p>
            </div>

            <!-- Form Status Notification -->
            <div id="contact-status" class="hidden p-4 rounded-xl text-xs font-mono text-center mb-6"></div>

            <form id="contact-form" class="space-y-4">
                <!-- Honeypot field for bot protection (Item #18) -->
                <input type="text" name="nexus_security_trap" style="display:none;" tabindex="-1" autocomplete="off">

                <div>
                    <label for="contact-name" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        Your Handle / Name
                    </label>
                    <input 
                        type="text" 
                        id="contact-name" 
                        required 
                        placeholder="e.g. CyberKnight" 
                        minlength="2"
                        maxlength="50"
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                </div>

                <div>
                    <label for="contact-email" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        Frequency (Email Address)
                    </label>
                    <input 
                        type="email" 
                        id="contact-email" 
                        required 
                        placeholder="operative@nexus.net" 
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                </div>

                <div>
                    <label for="contact-category" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        Transmission Category
                    </label>
                    <select 
                        id="contact-category"
                        class="w-full px-4 py-3 bg-[#0a0f24] border border-white/10 rounded-xl text-white focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm"
                    >
                        <option value="bug">Bug Report / Physics Glitch</option>
                        <option value="request">Game Request / Feature Suggestion</option>
                        <option value="auth">Auth0 Identity Inquiry</option>
                        <option value="general">General Transmission</option>
                    </select>
                </div>

                <div>
                    <label for="contact-message" class="block text-xs font-mono uppercase text-gray-300 mb-2">
                        Payload Message
                    </label>
                    <textarea 
                        id="contact-message" 
                        rows="4" 
                        required 
                        minlength="10"
                        maxlength="1000"
                        placeholder="Detail your feedback, browser specifications, or game recommendations..." 
                        class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all text-sm resize-none"
                    ></textarea>
                </div>

                <button 
                    type="submit" 
                    id="contact-submit-btn"
                    class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-accent-blue to-cyan-300 text-black font-extrabold text-sm tracking-wide hover:shadow-[0_0_30px_rgba(0,240,255,0.4)] hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer mt-2"
                >
                    Transmit Message <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. Secured by Auth0 & Vercel Edge.
    </footer>

    <script type="module">
        const form = document.getElementById('contact-form');
        const statusEl = document.getElementById('contact-status');
        const submitBtn = document.getElementById('contact-submit-btn');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Bot check
            const trap = form.querySelector('input[name="nexus_security_trap"]').value;
            if (trap.trim() !== '') return;

            // Client-side rate limiter check (max 3 per 5 min)
            try {
                const history = JSON.parse(sessionStorage.getItem('nexus_rl_contact_form') || '[]');
                const now = Date.now();
                const windowStart = now - (5 * 60 * 1000);
                const valid = history.filter(t => t > windowStart);

                if (valid.length >= 3) {
                    statusEl.className = 'p-4 rounded-xl text-xs font-mono text-center mb-6 bg-red-500/10 border border-red-500/30 text-red-300';
                    statusEl.textContent = 'Rate Limit Shield [429]: Max 3 transmissions per 5 minutes. Cooldown active.';
                    statusEl.classList.remove('hidden');

                    window.dispatchEvent(new CustomEvent('nexus:rate-limited', {
                        detail: { actionKey: 'contact_form', retryAfterSeconds: 300, resetAt: now + 300000 }
                    }));
                    return;
                }

                valid.push(now);
                sessionStorage.setItem('nexus_rl_contact_form', JSON.stringify(valid));
            } catch (err) {}

            // Form validation
            const name = document.getElementById('contact-name').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const message = document.getElementById('contact-message').value.trim();

            if (!name || !email || !message) {
                statusEl.className = 'p-4 rounded-xl text-xs font-mono text-center mb-6 bg-red-500/10 border border-red-500/30 text-red-300';
                statusEl.textContent = 'Please fill out all required fields with valid inputs.';
                statusEl.classList.remove('hidden');
                return;
            }

            // Success feedback
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Encrypting Transmission...';

            setTimeout(() => {
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Transmit Message <i class="fa-solid fa-paper-plane text-xs"></i>';
                
                statusEl.className = 'p-4 rounded-xl text-xs font-mono text-center mb-6 bg-emerald-500/10 border border-emerald-500/30 text-emerald-300';
                statusEl.textContent = '✓ Transmission verified and securely queued. Nexus team will decrypt shortly.';
                statusEl.classList.remove('hidden');
            }, 800);
        });
    </script>
</body>
</html>
