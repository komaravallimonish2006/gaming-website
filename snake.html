<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake Arcade | Nexus Gaming</title>
    <meta name="description" content="Play classic Retro Snake in neon cyberpunk style. 60 FPS HTML5 Canvas gameplay with smooth controls and cloud high scores.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Retro Snake Arcade | Nexus Gaming">
    <meta property="og:description" content="Eat cyber orbs, navigate the arena, and set the high score.">
    <meta property="og:image" content="/images/snake.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/3 left-1/3 w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[140px]"></div>
    </div>

    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 pt-32 pb-20">
        <div class="game-wrapper fade-in-up flex flex-col items-center">
            <div class="game-header text-center mb-6">
                <span class="text-xs font-mono text-emerald-400 uppercase tracking-widest block mb-1">Arcade Terminal</span>
                <h1 class="text-3xl md:text-4xl font-black text-white">Retro Snake</h1>
                <div id="status" class="status-display mt-2 font-mono text-sm px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-emerald-400 inline-block">
                    Score: <span id="score" class="font-bold text-white">0</span>
                </div>
            </div>
            
            <div class="canvas-container bg-[#0c1128]/80 p-3 rounded-2xl border border-white/10 shadow-[0_0_50px_rgba(52,211,153,0.15)]">
                <canvas id="snakeCanvas" width="400" height="400" class="rounded-xl bg-[#080d1a] border border-white/5 block max-w-full"></canvas>
            </div>

            <div class="game-controls text-center mt-6">
                <button id="start-btn" class="px-8 py-3 rounded-full bg-gradient-to-r from-emerald-400 to-cyan-400 text-black font-extrabold text-sm tracking-wide hover:shadow-[0_0_25px_rgba(52,211,153,0.4)] hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Start Game
                </button>
                <p class="text-gray-400 mt-3 text-xs font-mono">Use Arrow Keys / WASD to navigate.</p>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. All rights reserved.
    </footer>

    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/snake.js"></script>
</body>
</html>
