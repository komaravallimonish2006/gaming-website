<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe | Nexus Gaming</title>
    <meta name="description" content="Play Neon Tic-Tac-Toe in high-contrast cyberpunk styling. 2-player local multiplayer with win detection and score tracking.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Neon Tic-Tac-Toe | Nexus Gaming">
    <meta property="og:description" content="Classic Xs and Os with glowing cyber aesthetics.">
    <meta property="og:image" content="/images/tictactoe.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/3 left-1/3 w-[500px] h-[500px] bg-accent-blue/10 rounded-full blur-[140px]"></div>
    </div>

    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 pt-32 pb-20">
        <div class="game-wrapper fade-in-up flex flex-col items-center">
            <div class="game-header text-center mb-6">
                <span class="text-xs font-mono text-accent-blue uppercase tracking-widest block mb-1">Dual Terminal</span>
                <h1 class="text-3xl md:text-4xl font-black text-white">Neon Tic-Tac-Toe</h1>
                <div id="status" class="status-display mt-2 font-mono text-sm px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-cyan-300 inline-block">
                    Player X's Turn
                </div>
            </div>
            
            <div class="ttt-board" id="board">
                <div class="ttt-cell" data-index="0"></div>
                <div class="ttt-cell" data-index="1"></div>
                <div class="ttt-cell" data-index="2"></div>
                <div class="ttt-cell" data-index="3"></div>
                <div class="ttt-cell" data-index="4"></div>
                <div class="ttt-cell" data-index="5"></div>
                <div class="ttt-cell" data-index="6"></div>
                <div class="ttt-cell" data-index="7"></div>
                <div class="ttt-cell" data-index="8"></div>
            </div>

            <div class="game-controls text-center mt-6">
                <button id="reset-btn" class="px-8 py-3 rounded-full bg-gradient-to-r from-accent-blue to-purple-500 text-black font-extrabold text-sm tracking-wide hover:shadow-[0_0_25px_rgba(0,240,255,0.4)] hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Restart Match
                </button>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. All rights reserved.
    </footer>

    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/tictactoe.js"></script>
</body>
</html>
