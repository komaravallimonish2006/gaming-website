<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Number Logic Puzzle | Nexus Gaming</title>
    <meta name="description" content="Play the addictive 2048 puzzle game with sleek cyber styling. Slide tiles, combine powers of two, and reach the 2048 tile.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="2048 Number Logic Puzzle | Nexus Gaming">
    <meta property="og:description" content="Slide and merge tiles to conquer the 2048 matrix.">
    <meta property="og:image" content="/images/2048.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 76px);
            grid-template-rows: repeat(4, 76px);
            gap: 10px;
            background: rgba(12, 17, 40, 0.85);
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.15);
        }
        .grid-cell {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.15s ease-in-out;
            color: #ffffff;
        }
        .tile-2 { background: #1e293b; color: #94a3b8; }
        .tile-4 { background: #334155; color: #cbd5e1; }
        .tile-8 { background: #0284c7; color: #ffffff; }
        .tile-16 { background: #0369a1; color: #ffffff; }
        .tile-32 { background: #0d9488; color: #ffffff; }
        .tile-64 { background: #059669; color: #ffffff; }
        .tile-128 { background: #d97706; color: #ffffff; font-size: 1.4rem; }
        .tile-256 { background: #ea580c; color: #ffffff; font-size: 1.4rem; }
        .tile-512 { background: #dc2626; color: #ffffff; font-size: 1.4rem; }
        .tile-1024 { background: #9333ea; color: #ffffff; font-size: 1.1rem; }
        .tile-2048 { background: #eab308; color: #000000; font-size: 1.1rem; box-shadow: 0 0 30px #eab308; }
    </style>
</head>
<body class="bg-[#070b19] text-white min-h-screen flex flex-col justify-between overflow-x-hidden">
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 cyber-grid opacity-20"></div>
        <div class="absolute top-1/3 left-1/3 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[140px]"></div>
    </div>

    <div id="navbar-root"></div>
    <script type="module" src="/src/navbar-mount.tsx"></script>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 pt-32 pb-20">
        <div class="game-wrapper fade-in-up flex flex-col items-center">
            <div class="game-header text-center mb-6">
                <span class="text-xs font-mono text-amber-400 uppercase tracking-widest block mb-1">Logic Matrix</span>
                <h1 class="text-3xl md:text-4xl font-black text-white">2048 Logic</h1>
                <div id="status" class="status-display mt-2 font-mono text-sm px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-amber-300 inline-block">
                    Score: <span id="score" class="font-bold text-white">0</span>
                </div>
            </div>
            
            <div class="grid-container" id="grid">
                <!-- 16 cells -->
            </div>

            <div class="game-controls text-center mt-6">
                <button id="restart-btn" class="px-8 py-3 rounded-full bg-gradient-to-r from-amber-400 to-orange-500 text-black font-extrabold text-sm tracking-wide hover:shadow-[0_0_25px_rgba(251,191,36,0.4)] hover:scale-105 active:scale-95 transition-all cursor-pointer">
                    Restart Matrix
                </button>
                <p class="text-gray-400 mt-3 text-xs font-mono">Use Arrow Keys / Swipe to merge numbers.</p>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-6 text-center text-xs text-gray-500 border-t border-white/5">
        &copy; 2026 Nexus Gaming. All rights reserved.
    </footer>

    <script type="module" src="/js/auth.js"></script>
    <script type="module" src="/js/2048.js"></script>
</body>
</html>
